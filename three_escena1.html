<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Escena 1: Geometrías y Luces</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============ CONFIGURACIÓN INICIAL ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

        // ============ CÁMARA ============
        const camera = new THREE.PerspectiveCamera(
            60, // FOV
            window.innerWidth / window.innerHeight, // Aspect Ratio
            0.1, // Near clipping plane
            100 // Far clipping plane
        );
        camera.position.set(8, 5, 12);
        camera.lookAt(0, 1, 0);

        // ============ RENDERER ============
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ============ MANEJO DE RESIZE ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============ ORBIT CONTROLS ============
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 25;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.target.set(0, 1.5, 0);

        // ============ LUCES ============
        // HemisphereLight (luz ambiente + cielo/suelo)
        const hemisphereLight = new THREE.HemisphereLight(
            0x87CEEB, // Color del cielo
            0x362907, // Color del suelo
            0.6 // Intensidad
        );
        scene.add(hemisphereLight);

        // DirectionalLight con sombras
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -15;
        directionalLight.shadow.camera.right = 15;
        directionalLight.shadow.camera.top = 15;
        directionalLight.shadow.camera.bottom = -15;
        directionalLight.shadow.bias = -0.0001;
        scene.add(directionalLight);

        // PointLight adicional para ambiente
        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 20);
        pointLight.position.set(-4, 3, 4);
        scene.add(pointLight);

        // ============ SUELO ============
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x3d3d3d,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x666666);
        gridHelper.position.y = -0.49;
        scene.add(gridHelper);

        // ============ OBJETOS GEOMÉTRICOS ============
        const objects = [];

        // 1. BoxGeometry con MeshStandardMaterial
        const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const boxMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6b6b,
            roughness: 0.3,
            metalness: 0.7
        });
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.position.set(-3, 0.75, -2);
        box.castShadow = true;
        box.receiveShadow = true;
        scene.add(box);
        objects.push({ mesh: box, type: 'rotate' });

        // 2. SphereGeometry con MeshPhongMaterial
        const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x4ecdc4,
            shininess: 80,
            specular: 0x444444
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(3, 1, -2);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);
        objects.push({ mesh: sphere, type: 'bounce' });

        // 3. CylinderGeometry con MeshToonMaterial
        const cylinderGeometry = new THREE.CylinderGeometry(0.8, 0.8, 2, 32);
        const cylinderMaterial = new THREE.MeshToonMaterial({
            color: 0xffe66d,
            gradientMap: null
        });
        const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
        cylinder.position.set(-3, 1, 2);
        cylinder.castShadow = true;
        cylinder.receiveShadow = true;
        scene.add(cylinder);
        objects.push({ mesh: cylinder, type: 'rotate' });

        // 4. TorusGeometry con MeshStandardMaterial
        const torusGeometry = new THREE.TorusGeometry(1, 0.4, 16, 48);
        const torusMaterial = new THREE.MeshStandardMaterial({
            color: 0xa06cd5,
            roughness: 0.2,
            metalness: 0.8
        });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(3, 1, 2);
        torus.castShadow = true;
        torus.receiveShadow = true;
        scene.add(torus);
        objects.push({ mesh: torus, type: 'rotate' });

        // ============ ANIMACIÓN ============
        const clock = new THREE.Clock();

        function animate() {
            const elapsedTime = clock.getElapsedTime();
            
            requestAnimationFrame(animate);

            // Animar objetos
            objects.forEach(obj => {
                if (obj.type === 'rotate') {
                    obj.mesh.rotation.y += 0.01;
                    obj.mesh.rotation.x += 0.005;
                } else if (obj.type === 'bounce') {
                    obj.mesh.position.y = 1 + Math.sin(elapsedTime * 2) * 0.5;
                }
            });

            // Actualizar controles
            controls.update();

            // Renderizar
            renderer.render(scene, camera);
        }

        animate();

        console.log('✅ Escena 1 Three.js lista - Geometrías, luces y controles funcionando');
    </script>
</body>
</html>
